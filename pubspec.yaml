name: kxinspections
description: KxInspections Student App — Contesting Charges technical assessment.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^16.0.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Immutable models & JSON
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Network
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/json/
